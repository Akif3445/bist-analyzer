name: daily-robot

on:
  schedule:
    # Hafta içi 15:40 UTC = 18:40 TR — BIST kapanışından (18:00) sonra.
    - cron: "40 15 * * 1-5"
    # 21:30 UTC = US kapanışından (20:00 UTC / 16:00 ET) sonra. Yönetim turu
    # US kararlarını KAPANIŞ fiyatıyla verir; 15:40 turu US seansı açıkken
    # koşuyor ve o an yarım günün fiyatını görüyordu.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # elle tetikleme (Actions sekmesinden "Run workflow")

# En az yetki: robot yalnız kodu okur, Turso'ya yazar. GITHUB_TOKEN'ın repo
# yazma yetkisi olmasın — bağımlılıklardan biri ele geçirilse bile repoya
# commit/release atamasın (tedarik zinciri hasar sınırlama).
permissions:
  contents: read

jobs:
  robot:
    runs-on: ubuntu-latest
    # 25 → 55: skor günlüğü (~480 hisse × tam bileşik skor, ~13 dk) eklendi.
    # Robotun kendisi yine kendi adım sınırıyla korunuyor.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Robotu çalıştır
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Her tur YALNIZ kapanmış piyasayı işler:
          #   15:40 UTC (18:40 TR) → BIST kapandı, US seansı AÇIK  → BIST
          #   21:30 UTC (00:30 TR) → US kapandı                    → US
          # Önceden erken tura değer atanmadığı için o tur her iki piyasayı
          # işliyordu: US portföyleri günde İKİ kez karar görüyor ve erken
          # kararı seans ortasındaki yarım günün fiyatıyla veriyordu.
          # workflow_dispatch'te schedule boştur → değer '' → elle koşuda
          # her iki piyasa işlenir (kasıtlı: elle tetikleme tam tur demektir).
          ROBOT_ONLY_MARKET: ${{ github.event.schedule == '30 21 * * 1-5' && 'US' || (github.event.schedule == '40 15 * * 1-5' && 'BIST' || '') }}
        timeout-minutes: 25
        run: python daily_robot.py

      # Bileşen günlüğü AYRI adım: yönetim turuyla aynı süre sınırını
      # paylaşmasın, ve günlükteki bir sorun yönetimi asla geciktirmesin.
      # `!cancelled()`: robot adımı kırmızı bitse de (ör. tek bir piyasanın
      # denetim hatası) günlük yine yazılsın — o günün kaydı kaybolmasın.
      # US turunda (ROBOT_ONLY_MARKET=US) betik kendini atlar.
      - name: Skor bileşen günlüğü
        if: ${{ !cancelled() }}
        timeout-minutes: 28
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ROBOT_ONLY_MARKET: ${{ github.event.schedule == '30 21 * * 1-5' && 'US' || (github.event.schedule == '40 15 * * 1-5' && 'BIST' || '') }}
        run: python skor_gunlugu.py yaz
